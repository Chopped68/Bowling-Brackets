<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling Bracket</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px 0;
}

.controls {
    background: white;
    padding: 20px;
    margin: 20px auto;
    max-width: 1200px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

.controls h2 {
    margin-top: 0;
}

.player-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.player-grid input {
    padding: 12px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
}

.start-btn {
    margin-top: 15px;
    background: #2563eb;
    color: white;
}

.reset-btn {
    margin-top: 15px;
    background: #dc2626;
    color: white;
    margin-left: 8px;
}

.bracket-wrapper {
    overflow-x: auto;
    padding: 20px;
}

.bracket {
    display: flex;
    gap: 30px;
    min-width: 1200px;
    max-width: 1600px;
    margin: auto;
}

.round {
    flex: 1;
    min-width: 230px;
}

.round h3 {
    text-align: center;
    margin: 0 0 15px 0;
}

.matches {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.match {
    background: white;
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
}

.player {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    min-height: 38px;
}

.player:last-of-type {
    border-bottom: none;
}

.player.winner {
    font-weight: bold;
    background: #dcfce7;
}

.player.loser {
    color: #888;
}

.score {
    float: right;
    font-weight: bold;
}

.match button {
    width: 100%;
    margin-top: 10px;
    background: #16a34a;
    color: white;
}

.match.pending button {
    background: #2563eb;
}

.match.complete {
    border: 2px solid #16a34a;
}

.champion {
    max-width: 600px;
    margin: 30px auto;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.champion h2 {
    margin-top: 0;
}

.champion-name {
    font-size: 30px;
    font-weight: bold;
}

.empty {
    color: #888;
    font-style: italic;
}

@media (max-width: 800px) {
    .player-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>Bowling Tournament Bracket</h1>
    <div>16 Player Single Elimination</div>
</header>

<section class="controls">

    <h2>Players</h2>

    <div class="player-grid" id="playerInputs"></div>

    <button class="start-btn" onclick="startTournament()">
        Start Tournament
    </button>

    <button class="reset-btn" onclick="resetTournament()">
        Reset
    </button>

</section>

<div id="championArea"></div>

<div class="bracket-wrapper">
    <div class="bracket" id="bracket"></div>
</div>

<script>

const PLAYER_COUNT = 16;

let players = [];
let rounds = [];
let tournamentStarted = false;


/* ---------------------------------
   CREATE PLAYER INPUTS
---------------------------------- */

function createPlayerInputs() {

    const container = document.getElementById("playerInputs");

    container.innerHTML = "";

    for (let i = 0; i < PLAYER_COUNT; i++) {

        const input = document.createElement("input");

        input.type = "text";
        input.placeholder = "Player " + (i + 1);
        input.id = "player-" + i;

        container.appendChild(input);
    }
}


/* ---------------------------------
   START TOURNAMENT
---------------------------------- */

function startTournament() {

    players = [];

    for (let i = 0; i < PLAYER_COUNT; i++) {

        const input = document.getElementById("player-" + i);

        let name = input.value.trim();

        if (!name) {
            name = "Player " + (i + 1);
        }

        players.push({
            id: i,
            name: name
        });
    }

    createRounds();

    tournamentStarted = true;

    renderBracket();
}


/* ---------------------------------
   CREATE BRACKET
---------------------------------- */

function createRounds() {

    rounds = [];

    // Round 1
    const round1 = [];

    for (let i = 0; i < 16; i += 2) {

        round1.push({
            player1: players[i],
            player2: players[i + 1],
            score1: null,
            score2: null,
            winner: null
        });
    }

    rounds.push(round1);

    // Round 2
    rounds.push(createEmptyRound(4));

    // Semifinal
    rounds.push(createEmptyRound(2));

    // Championship
    rounds.push(createEmptyRound(1));
}


function createEmptyRound(count) {

    const result = [];

    for (let i = 0; i < count; i++) {

        result.push({
            player1: null,
            player2: null,
            score1: null,
            score2: null,
            winner: null
        });
    }

    return result;
}


/* ---------------------------------
   RENDER BRACKET
---------------------------------- */

function renderBracket() {

    const bracket = document.getElementById("bracket");

    bracket.innerHTML = "";

    const names = [
        "Round 1",
        "Quarterfinals",
        "Semifinals",
        "Championship"
    ];

    rounds.forEach((round, roundIndex) => {

        const roundDiv = document.createElement("div");

        roundDiv.className = "round";

        const title = document.createElement("h3");

        title.textContent = names[roundIndex];

        roundDiv.appendChild(title);

        const matchesDiv = document.createElement("div");

        matchesDiv.className = "matches";

        round.forEach((match, matchIndex) => {

            const matchDiv = createMatchDiv(
                match,
                roundIndex,
                matchIndex
            );

            matchesDiv.appendChild(matchDiv);
        });

        roundDiv.appendChild(matchesDiv);

        bracket.appendChild(roundDiv);
    });

    showChampion();
}


/* ---------------------------------
   CREATE MATCH
---------------------------------- */

function createMatchDiv(match, roundIndex, matchIndex) {

    const div = document.createElement("div");

    div.className = "match";

    if (!match.player1 || !match.player2) {
        div.classList.add("pending");
    }

    if (match.winner) {
        div.classList.add("complete");
    }

    const p1 = document.createElement("div");

    p1.className = "player";

    if (match.winner === match.player1) {
        p1.classList.add("winner");
    }

    if (match.winner && match.winner !== match.player1) {
        p1.classList.add("loser");
    }

    p1.innerHTML = match.player1
        ? escapeHtml(match.player1.name)
        : '<span class="empty">Waiting...</span>';

    if (match.score1 !== null) {
        p1.innerHTML +=
            '<span class="score">' +
            match.score1 +
            '</span>';
    }


    const p2 = document.createElement("div");

    p2.className = "player";

    if (match.winner === match.player2) {
        p2.classList.add("winner");
    }

    if (match.winner && match.winner !== match.player2) {
        p2.classList.add("loser");
    }

    p2.innerHTML = match.player2
        ? escapeHtml(match.player2.name)
        : '<span class="empty">Waiting...</span>';

    if (match.score2 !== null) {
        p2.innerHTML +=
            '<span class="score">' +
            match.score2 +
            '</span>';
    }


    div.appendChild(p1);
    div.appendChild(p2);


    if (match.player1 && match.player2 && !match.winner) {

        const button = document.createElement("button");

        button.textContent = "Enter Scores";

        button.onclick = function() {

            enterScores(match, roundIndex, matchIndex);

        };

        div.appendChild(button);
    }


    return div;
}


/* ---------------------------------
   ENTER SCORES
---------------------------------- */

function enterScores(match, roundIndex, matchIndex) {

    const name1 = match.player1.name;
    const name2 = match.player2.name;

    let score1 = prompt(
        "Enter score for " + name1 + ":"
    );

    if (score1 === null) {
        return;
    }

    let score2 = prompt(
        "Enter score for " + name2 + ":"
    );

    if (score2 === null) {
        return;
    }

    score1 = Number(score1);
    score2 = Number(score2);

    if (
        !Number.isFinite(score1) ||
        !Number.isFinite(score2) ||
        score1 < 0 ||
        score2 < 0 ||
        score1 > 300 ||
        score2 > 300
    ) {

        alert("Please enter valid bowling scores from 0 to 300.");

        return;
    }


    match.score1 = score1;
    match.score2 = score2;


    if (score1 > score2) {

        match.winner = match.player1;

    }
    else if (score2 > score1) {

        match.winner = match.player2;

    }
    else {

        // Tie
        const choice = prompt(
            "Scores are tied.\n\n" +
            "Enter 1 for " + name1 + "\n" +
            "Enter 2 for " + name2
        );

        if (choice === "1") {

            match.winner = match.player1;

        }
        else if (choice === "2") {

            match.winner = match.player2;

        }
        else {

            alert("No winner selected. Please enter the scores again.");

            match.score1 = null;
            match.score2 = null;

            return;
        }
    }


    advanceWinner(roundIndex, matchIndex);

    renderBracket();
}


/* ---------------------------------
   ADVANCE WINNER
---------------------------------- */

function advanceWinner(roundIndex, matchIndex) {

    const winner = rounds[roundIndex][matchIndex].winner;

    if (!winner) {
        return;
    }


    // Championship
    if (roundIndex === 3) {
        return;
    }


    const nextMatchIndex = Math.floor(matchIndex / 2);

    const nextMatch = rounds[roundIndex + 1][nextMatchIndex];


    if (matchIndex % 2 === 0) {

        nextMatch.player1 = winner;

    } else {

        nextMatch.player2 = winner;

    }


    // Clear any old score/winner in the next match
    nextMatch.score1 = null;
    nextMatch.score2 = null;
    nextMatch.winner = null;
}


/* ---------------------------------
   CHAMPION
---------------------------------- */

function showChampion() {

    const area = document.getElementById("championArea");

    area.innerHTML = "";

    if (!rounds.length) {
        return;
    }

    const finalMatch = rounds[3][0];

    if (!finalMatch.winner) {
        return;
    }

    const div = document.createElement("div");

    div.className = "champion";

    div.innerHTML =
        "<h2>🏆 Tournament Champion</h2>" +
        '<div class="champion-name">' +
        escapeHtml(finalMatch.winner.name) +
        "</div>";

    area.appendChild(div);
}


/* ---------------------------------
   RESET
---------------------------------- */

function resetTournament() {

    if (!confirm("Reset the tournament?")) {
        return;
    }

    players = [];
    rounds = [];
    tournamentStarted = false;

    document.getElementById("bracket").innerHTML = "";
    document.getElementById("championArea").innerHTML = "";

    createPlayerInputs();
}


/* ---------------------------------
   HTML SAFETY
---------------------------------- */

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ---------------------------------
   INITIALIZE
---------------------------------- */

createPlayerInputs();

</script>

</body>
</html>
