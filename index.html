<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling Tournament Bracket</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 24px 15px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 32px;
}

header p {
    margin: 0;
    font-size: 18px;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

.setup {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 25px;
}

.setup h2 {
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

select,
input {
    padding: 11px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

select {
    min-width: 120px;
}

.player-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-size: 16px;
    cursor: pointer;
}

.start-btn {
    background: #2563eb;
    color: white;
}

.reset-btn {
    background: #dc2626;
    color: white;
}

.score-btn {
    background: #16a34a;
    color: white;
    width: 100%;
    margin-top: 8px;
}

button:hover {
    opacity: .9;
}

#bracket {
    display: none;
}

.bracket-wrapper {
    overflow-x: auto;
    padding-bottom: 20px;
}

.bracket {
    display: flex;
    gap: 25px;
    min-width: max-content;
}

.round {
    width: 230px;
}

.round-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.match {
    background: white;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 25px;
    box-shadow: 0 2px 7px rgba(0,0,0,.15);
}

.player {
    padding: 9px;
    border: 1px solid #ddd;
    margin-bottom: 5px;
    border-radius: 5px;
    background: #fafafa;
}

.player.winner {
    font-weight: bold;
    background: #dcfce7;
    border-color: #16a34a;
}

.player.empty {
    color: #999;
    font-style: italic;
}

.scores {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.5;
}

.champion {
    background: #fff7ed;
    border: 3px solid #f59e0b;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    margin-top: 30px;
    font-size: 24px;
    font-weight: bold;
}

.hidden {
    display: none;
}

@media (max-width: 800px) {
    .player-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Bowling Tournament Bracket</h1>
    <p id="subtitle">Single Elimination</p>
</header>

<div class="container">

    <div class="setup" id="setup">

        <h2>Tournament Setup</h2>

        <div class="controls">
            <label for="playerCount"><strong>Number of Players:</strong></label>

            <select id="playerCount" onchange="buildPlayerInputs()">
                <option value="4">4 Players</option>
                <option value="8">8 Players</option>
                <option value="16" selected>16 Players</option>
            </select>
        </div>

        <div id="playerInputs" class="player-grid"></div>

        <button class="start-btn" onclick="startTournament()">
            Start Tournament
        </button>

        <button class="reset-btn" onclick="resetTournament()">
            Reset
        </button>

    </div>

    <div id="bracket">

        <div class="bracket-wrapper">
            <div class="bracket" id="bracketContent"></div>
        </div>

        <div id="championBox"></div>

    </div>

</div>

<script>

let players = [];
let rounds = [];
let playerCount = 16;


/* -----------------------------
   BUILD PLAYER INPUTS
----------------------------- */

function buildPlayerInputs() {

    playerCount = parseInt(
        document.getElementById("playerCount").value
    );

    const container = document.getElementById("playerInputs");

    container.innerHTML = "";

    for (let i = 0; i < playerCount; i++) {

        const input = document.createElement("input");

        input.type = "text";
        input.placeholder = "Player " + (i + 1);
        input.id = "player" + i;

        container.appendChild(input);
    }
}


/* -----------------------------
   START TOURNAMENT
----------------------------- */

function startTournament() {

    players = [];

    for (let i = 0; i < playerCount; i++) {

        const input = document.getElementById("player" + i);

        let name = input.value.trim();

        if (!name) {
            name = "Player " + (i + 1);
        }

        players.push({
            name: name
        });
    }

    createRounds();

    document.getElementById("bracket").style.display = "block";

    document.getElementById("subtitle").textContent =
        playerCount + " Player Single Elimination";

    renderBracket();

    window.scrollTo({
        top: document.getElementById("bracket").offsetTop,
        behavior: "smooth"
    });
}


/* -----------------------------
   CREATE ROUNDS
----------------------------- */

function createRounds() {

    rounds = [];

    let numberOfPlayers = playerCount;

    let firstRound = [];

    for (let i = 0; i < numberOfPlayers; i += 2) {

        firstRound.push({
            player1: players[i],
            player2: players[i + 1],
            winner: null,
            score1: null,
            score2: null,
            games1: [],
            games2: []
        });
    }

    rounds.push(firstRound);

    while (numberOfPlayers > 2) {

        numberOfPlayers = numberOfPlayers / 2;

        let nextRound = [];

        for (let i = 0; i < numberOfPlayers / 2; i++) {

            nextRound.push({
                player1: null,
                player2: null,
                winner: null,
                score1: null,
                score2: null,
                games1: [],
                games2: []
            });
        }

        rounds.push(nextRound);
    }
}


/* -----------------------------
   RENDER BRACKET
----------------------------- */

function renderBracket() {

    const bracket = document.getElementById("bracketContent");

    bracket.innerHTML = "";

    const roundNames = [];

    for (let i = 0; i < rounds.length; i++) {

        if (i === rounds.length - 1) {
            roundNames.push("Championship");
        } else if (i === rounds.length - 2) {
            roundNames.push("Semifinals");
        } else if (i === rounds.length - 3) {
            roundNames.push("Quarterfinals");
        } else {
            roundNames.push("Round " + (i + 1));
        }
    }

    rounds.forEach((round, roundIndex) => {

        const roundDiv = document.createElement("div");

        roundDiv.className = "round";

        const title = document.createElement("div");

        title.className = "round-title";
        title.textContent = roundNames[roundIndex];

        roundDiv.appendChild(title);

        round.forEach((match, matchIndex) => {

            const matchDiv = document.createElement("div");

            matchDiv.className = "match";

            addPlayer(
                matchDiv,
                match.player1,
                match.winner,
                match.score1
            );

            addPlayer(
                matchDiv,
                match.player2,
                match.winner,
                match.score2
            );

            /*
             * SCORE BUTTON
             *
             * This is intentionally shown whenever both
             * players are present and there is no winner.
             */

            if (
                match.player1 &&
                match.player2 &&
                !match.winner
            ) {

                const button = document.createElement("button");

                button.className = "score-btn";
                button.textContent = "Enter Scores";

                button.onclick = function() {

                    enterScores(roundIndex, matchIndex);

                };

                matchDiv.appendChild(button);
            }

            /*
             * SHOW SCORES
             */

            if (match.winner) {

                const scores = document.createElement("div");

                scores.className = "scores";

                if (match.games1.length > 0) {

                    scores.innerHTML +=
                        "<strong>" +
                        match.player1.name +
                        ":</strong> " +
                        match.games1.join(", ") +
                        " = " +
                        match.score1 +
                        "<br>";
                }

                if (match.games2.length > 0) {

                    scores.innerHTML +=
                        "<strong>" +
                        match.player2.name +
                        ":</strong> " +
                        match.games2.join(", ") +
                        " = " +
                        match.score2;
                }

                matchDiv.appendChild(scores);
            }

            roundDiv.appendChild(matchDiv);

        });

        bracket.appendChild(roundDiv);
    });

    updateChampion();
}


/* -----------------------------
   ADD PLAYER TO MATCH
----------------------------- */

function addPlayer(matchDiv, player, winner, score) {

    const div = document.createElement("div");

    div.className = "player";

    if (!player) {

        div.classList.add("empty");
        div.textContent = "Waiting for winner";

    } else {

        div.textContent = player.name;

        if (winner && winner === player) {
            div.classList.add("winner");
        }
    }

    matchDiv.appendChild(div);
}


/* -----------------------------
   ENTER SCORES
----------------------------- */

function enterScores(roundIndex, matchIndex) {

    const match = rounds[roundIndex][matchIndex];

    if (!match.player1 || !match.player2) {
        return;
    }

    /*
     * GAME 1
     */

    const g1p1 = prompt(
        "Enter Game 1 score for " +
        match.player1.name
    );

    if (g1p1 === null) return;

    const g1p2 = prompt(
        "Enter Game 1 score for " +
        match.player2.name
    );

    if (g1p2 === null) return;

    const scoreA = parseInt(g1p1);
    const scoreB = parseInt(g1p2);

    if (
        isNaN(scoreA) ||
        isNaN(scoreB) ||
        scoreA < 0 ||
        scoreB < 0
    ) {

        alert("Please enter valid bowling scores.");

        return;
    }

    match.games1 = [scoreA];
    match.games2 = [scoreB];

    /*
     * OPTIONAL GAME 2
     */

    const g2p1 = prompt(
        "Game 2 for " +
        match.player1.name +
        " (Cancel to finish)"
    );

    if (g2p1 !== null && g2p1.trim() !== "") {

        const g2p2 = prompt(
            "Game 2 for " +
            match.player2.name
        );

        if (g2p2 === null) return;

        const a = parseInt(g2p1);
        const b = parseInt(g2p2);

        if (
            isNaN(a) ||
            isNaN(b) ||
            a < 0 ||
            b < 0
        ) {

            alert("Please enter valid bowling scores.");

            return;
        }

        match.games1.push(a);
        match.games2.push(b);
    }

    /*
     * OPTIONAL GAME 3
     */

    const g3p1 = prompt(
        "Game 3 for " +
        match.player1.name +
        " (Cancel to finish)"
    );

    if (g3p1 !== null && g3p1.trim() !== "") {

        const g3p2 = prompt(
            "Game 3 for " +
            match.player2.name
        );

        if (g3p2 === null) return;

        const a = parseInt(g3p1);
        const b = parseInt(g3p2);

        if (
            isNaN(a) ||
            isNaN(b) ||
            a < 0 ||
            b < 0
        ) {

            alert("Please enter valid bowling scores.");

            return;
        }

        match.games1.push(a);
        match.games2.push(b);
    }

    /*
     * TOTAL SCORES
     */

    match.score1 = match.games1.reduce(
        (total, score) => total + score,
        0
    );

    match.score2 = match.games2.reduce(
        (total, score) => total + score,
        0
    );

    /*
     * DETERMINE WINNER
     */

    if (match.score1 > match.score2) {

        match.winner = match.player1;

    } else if (match.score2 > match.score1) {

        match.winner = match.player2;

    } else {

        /*
         * TIEBREAKER
         */

        const t1 = prompt(
            "Scores are tied at " +
            match.score1 +
            ". Enter tiebreaker score for " +
            match.player1.name
        );

        if (t1 === null) return;

        const t2 = prompt(
            "Enter tiebreaker score for " +
            match.player2.name
        );

        if (t2 === null) return;

        const tie1 = parseInt(t1);
        const tie2 = parseInt(t2);

        if (
            isNaN(tie1) ||
            isNaN(tie2)
        ) {

            alert("Invalid tiebreaker scores.");

            return;
        }

        if (tie1 > tie2) {

            match.winner = match.player1;

        } else if (tie2 > tie1) {

            match.winner = match.player2;

        } else {

            alert(
                "The tiebreaker is also tied. " +
                "Please enter scores again."
            );

            return;
        }
    }

    /*
     * ADVANCE WINNER
     */

    advanceWinner(roundIndex, matchIndex);

    renderBracket();
}


/* -----------------------------
   ADVANCE WINNER
----------------------------- */

function advanceWinner(roundIndex, matchIndex) {

    const match = rounds[roundIndex][matchIndex];

    if (!match.winner) return;

    /*
     * Championship
     */

    if (roundIndex === rounds.length - 1) {

        return;
    }

    const nextRound = rounds[roundIndex + 1];

    const nextMatchIndex = Math.floor(
        matchIndex / 2
    );

    const nextMatch = nextRound[nextMatchIndex];

    if (matchIndex % 2 === 0) {

        nextMatch.player1 = match.winner;

    } else {

        nextMatch.player2 = match.winner;
    }
}


/* -----------------------------
   SHOW CHAMPION
----------------------------- */

function updateChampion() {

    const box = document.getElementById("championBox");

    box.innerHTML = "";

    const finalRound = rounds[rounds.length - 1];

    if (
        finalRound &&
        finalRound[0] &&
        finalRound[0].winner
    ) {

        const champion = document.createElement("div");

        champion.className = "champion";

        champion.innerHTML =
            "🏆 Tournament Champion<br><br>" +
            finalRound[0].winner.name;

        box.appendChild(champion);
    }
}


/* -----------------------------
   RESET
----------------------------- */

function resetTournament() {

    if (
        !confirm(
            "Are you sure you want to reset the tournament?"
        )
    ) {
        return;
    }

    players = [];
    rounds = [];

    document.getElementById("bracket").style.display =
        "none";

    document.getElementById("bracketContent").innerHTML =
        "";

    document.getElementById("championBox").innerHTML =
        "";

    document.getElementById("subtitle").textContent =
        "Single Elimination";

    buildPlayerInputs();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* -----------------------------
   INITIAL LOAD
----------------------------- */

buildPlayerInputs();

</script>

</body>
</html>
