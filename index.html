<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling Brackets</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #ff9900;
    margin-bottom: 25px;
}

.card {
    background: #1f2937;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #4b5563;
    background: #374151;
    color: white;
    font-size: 16px;
}

button {
    background: #ff9900;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #e68a00;
}

.secondary {
    background: #4b5563;
}

.secondary:hover {
    background: #374151;
}

.hidden {
    display: none;
}

.players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
}

.bracket {
    overflow-x: auto;
    padding-bottom: 20px;
}

.rounds {
    display: flex;
    gap: 30px;
    min-width: 850px;
}

.round {
    flex: 1;
    min-width: 230px;
}

.round h3 {
    text-align: center;
    color: #ff9900;
}

.match {
    background: #374151;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 25px;
}

.player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #4b5563;
    padding: 8px;
    margin: 4px 0;
    border-radius: 5px;
}

.player.winner {
    background: #166534;
}

.player input {
    width: 70px;
    padding: 6px;
}

.match button {
    margin-top: 8px;
    width: 100%;
    font-size: 14px;
}

.info {
    background: #374151;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
}

.winner-banner {
    text-align: center;
    background: #166534;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎳 Bowling Brackets</h1>

<div id="setup" class="card">

    <h2>Tournament Setup</h2>

    <label for="bracketSize">Bracket Size</label>
    <select id="bracketSize">
        <option value="4">4 Players</option>
        <option value="8" selected>8 Players</option>
        <option value="16">16 Players</option>
    </select>

    <label for="bracketType">Bracket Type</label>
    <select id="bracketType">
        <option value="handicap">Handicap</option>
        <option value="scratch">Scratch</option>
    </select>

    <label for="tiebreaker">Tiebreaker</label>
    <select id="tiebreaker">
        <option value="highest">Highest Game</option>
        <option value="total">Total Pins</option>
        <option value="head">Head-to-Head</option>
    </select>

    <br><br>

    <button onclick="createTournament()">Create Tournament</button>

</div>

<div id="players" class="card hidden">

    <h2>Enter Players</h2>

    <div id="playerInputs" class="players-grid"></div>

    <br>

    <button onclick="startTournament()">Start Tournament</button>
    <button class="secondary" onclick="backToSetup()">Back</button>

</div>

<div id="tournament" class="hidden">

    <div class="card">

        <div class="info">
            <strong>Bracket:</strong>
            <span id="typeDisplay"></span>
            &nbsp; | &nbsp;
            <strong>Tiebreaker:</strong>
            <span id="tieDisplay"></span>
        </div>

        <div class="bracket">
            <div id="rounds" class="rounds"></div>
        </div>

    </div>

    <button class="secondary" onclick="newTournament()">
        New Tournament
    </button>

</div>

</div>

<script>

let tournamentSize = 8;
let bracketType = "handicap";
let tiebreaker = "highest";
let players = [];
let matches = [];

function createTournament() {

    tournamentSize =
        parseInt(document.getElementById("bracketSize").value);

    bracketType =
        document.getElementById("bracketType").value;

    tiebreaker =
        document.getElementById("tiebreaker").value;

    const playerInputs =
        document.getElementById("playerInputs");

    playerInputs.innerHTML = "";

    for (let i = 0; i < tournamentSize; i++) {

        const input = document.createElement("input");

        input.type = "text";
        input.placeholder = "Player " + (i + 1);
        input.id = "player" + i;

        playerInputs.appendChild(input);
    }

    document.getElementById("setup").classList.add("hidden");
    document.getElementById("players").classList.remove("hidden");
}

function startTournament() {

    players = [];

    for (let i = 0; i < tournamentSize; i++) {

        const name =
            document.getElementById("player" + i).value.trim();

        if (!name) {
            alert("Please enter a name for every player.");
            return;
        }

        players.push({
            name: name,
            score: null,
            highest: null
        });
    }

    document.getElementById("players").classList.add("hidden");
    document.getElementById("tournament").classList.remove("hidden");

    document.getElementById("typeDisplay").textContent =
        bracketType === "handicap" ? "Handicap" : "Scratch";

    let tieText = "Highest Game";

    if (tiebreaker === "total")
        tieText = "Total Pins";

    if (tiebreaker === "head")
        tieText = "Head-to-Head";

    document.getElementById("tieDisplay").textContent = tieText;

    buildBracket();
}

function buildBracket() {

    matches = [];

    for (let i = 0; i < players.length; i += 2) {

        matches.push({
            player1: players[i],
            player2: players[i + 1],
            winner: null
        });
    }

    renderBracket();
}

function renderBracket() {

    const roundsContainer =
        document.getElementById("rounds");

    roundsContainer.innerHTML = "";

    let currentMatches = matches;

    let roundNumber = 1;

    while (currentMatches.length > 0) {

        const roundDiv = document.createElement("div");

        roundDiv.className = "round";

        const title = document.createElement("h3");

        if (currentMatches.length === 1) {
            title.textContent = "Championship";
        } else {
            title.textContent = "Round " + roundNumber;
        }

        roundDiv.appendChild(title);

        currentMatches.forEach((match, index) => {

            const matchDiv =
                document.createElement("div");

            matchDiv.className = "match";

            const p1 =
                createPlayerRow(match.player1);

            const p2 =
                createPlayerRow(match.player2);

            matchDiv.appendChild(p1);
            matchDiv.appendChild(p2);

            if (!match.player1 &&
                match.player2 &&
                !match.winner) {

                const button =
                    document.createElement("button");

                button.textContent = "Enter Scores";

                button.onclick = function() {
                    enterScores(match);
                };

                matchDiv.appendChild(button);
            }

            if (match.winner) {

                const result =
                    document.createElement("div");

                result.style.marginTop = "10px";
                result.style.textAlign = "center";
                result.innerHTML =
                    "<strong>Winner: " +
                    match.winner.name +
                    "</strong>";

                matchDiv.appendChild(result);
            }

            roundDiv.appendChild(matchDiv);
        });

        roundsContainer.appendChild(roundDiv);

        if (currentMatches.length === 1)
            break;

        const nextMatches = [];

        for (let i = 0; i < currentMatches.length; i += 2) {

            nextMatches.push({
                player1:
                    currentMatches[i].winner || null,

                player2:
                    currentMatches[i + 1]
                        ? currentMatches[i + 1].winner || null
                        : null,

                winner: null
            });
        }

        currentMatches = nextMatches;

        roundNumber++;
    }

    checkChampion();
}

function createPlayerRow(player) {

    const row =
        document.createElement("div");

    row.className = "player";

    if (!player)
        row.innerHTML = "<span>Waiting...</span>";
    else
        row.innerHTML =
            "<span>" + player.name + "</span>";

    return row;
}

function enterScores(match) {

    if (!match.player1 || !match.player2)
        return;

    let score1 =
        prompt("Enter score for " + match.player1.name);

    if (score1 === null)
        return;

    let score2 =
        prompt("Enter score for " + match.player2.name);

    if (score2 === null)
        return;

    score1 = parseInt(score1);
    score2 = parseInt(score2);

    if (isNaN(score1) || isNaN(score2)) {
        alert("Please enter valid scores.");
        return;
    }

    match.player1.score = score1;
    match.player2.score = score2;

    let winner;

    if (score1 > score2) {

        winner = match.player1;

    } else if (score2 > score1) {

        winner = match.player2;

    } else {

        winner = resolveTie(match);
    }

    if (!winner)
        return;

    match.winner = winner;

    updateFutureRounds();

    renderBracket();
}

function resolveTie(match) {

    if (tiebreaker === "head") {

        alert(
            "Scores are tied. Head-to-head tiebreaker selected. " +
            "Please enter the winner manually."
        );

        return manualWinner(match);
    }

    if (tiebreaker === "highest") {

        const high1 =
            parseInt(prompt(
                "Tie game.\nEnter highest game for " +
                match.player1.name
            ));

        const high2 =
            parseInt(prompt(
                "Enter highest game for " +
                match.player2.name
            ));

        if (isNaN(high1) || isNaN(high2)) {
            alert("Invalid tiebreaker scores.");
            return null;
        }

        if (high1 > high2)
            return match.player1;

        if (high2 > high1)
            return match.player2;

        return manualWinner(match);
    }

    if (tiebreaker === "total") {

        const total1 =
            parseInt(prompt(
                "Tie game.\nEnter total pins for " +
                match.player1.name
            ));

        const total2 =
            parseInt(prompt(
                "Enter total pins for " +
                match.player2.name
            ));

        if (isNaN(total1) || isNaN(total2)) {
            alert("Invalid tiebreaker scores.");
            return null;
        }

        if (total1 > total2)
            return match.player1;

        if (total2 > total1)
            return match.player2;

        return manualWinner(match);
    }
}

function manualWinner(match) {

    const choice =
        prompt(
            "Scores are still tied.\n\n" +
            "Enter 1 for " + match.player1.name +
            "\nEnter 2 for " + match.player2.name
        );

    if (choice === "1")
        return match.player1;

    if (choice === "2")
        return match.player2;

    alert("No winner selected.");
    return null;
}

function updateFutureRounds() {

    const allMatches = [];

    function collectRound(roundMatches) {

        roundMatches.forEach(m => {
            allMatches.push(m);
        });
    }

    collectRound(matches);

    let current = matches;

    while (current.length > 1) {

        const next = [];

        for (let i = 0; i < current.length; i += 2) {

            next.push({
                player1: current[i].winner,
                player2:
                    current[i + 1]
                        ? current[i + 1].winner
                        : null,
                winner: null
            });
        }

        next.forEach(m => allMatches.push(m));

        current = next;
    }

    matches = allMatches.slice(0, tournamentSize - 1);
}

function checkChampion() {

    const champion =
        matches.find(
            m => m.player1 &&
                 m.player2 &&
                 m.winner
        );

    if (!champion)
        return;
}

function backToSetup() {

    document.getElementById("players")
        .classList.add("hidden");

    document.getElementById("setup")
        .classList.remove("hidden");
}

function newTournament() {

    players = [];
    matches = [];

    document.getElementById("tournament")
        .classList.add("hidden");

    document.getElementById("setup")
        .classList.remove("hidden");
}

</script>

</body>
</html>
